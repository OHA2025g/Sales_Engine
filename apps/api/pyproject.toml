[project]
name = "agrayian-revenue-os-api"
version = "0.1.0"
description = "AGRAYIAN Autonomous Revenue OS API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<0.116",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic-settings>=2.7.0",
  "pydantic[email]>=2.10.4,<2.11",
  "pyjwt>=2.10.1",
  "argon2-cffi>=23.1.0",
  "httpx>=0.28.1",
  "redis>=5.2.1",
  "celery>=5.4.0",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2.3",
  "prometheus-client>=0.21.1",
  "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "ruff==0.16.7",
  "bandit>=1.8.0",
  "pip-audit>=2.7.3",
]
otel = [
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
]
storage = [
  "boto3>=1.35.0",
]
ml = [
  "scikit-learn>=1.5.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "postgres: tests that require PostgreSQL RLS",
]
